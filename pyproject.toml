[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citeguard"
version = "0.1.0"
description = "SkillHub citation-integrity-verifier deterministic anti-hallucination gate + local Spark-X2.6-4B claim-alignment pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "teliso_71" }]
dependencies = []

[project.scripts]
citeguard = "citeguard.cli:main"

[tool.setuptools.packages.find]
include = ["citeguard*"]
