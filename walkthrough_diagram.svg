  <text x="54" y="186" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">+ Manuscript Claim Sentences</text>
  <text x="54" y="218" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">• Extract DOI / arXiv ID / Title</text>
